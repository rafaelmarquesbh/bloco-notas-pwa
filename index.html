<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7c948"><link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><title>Minhas Notas</title></head><body>
<header><div class="brand"><span>✦</span><div><b>Minhas Notas</b><small>Bloco de notas</small></div></div><div class="actions"><span id="connection" class="connection"><i class="connection-dot"></i><span class="connection-text">Conectando...</span></span><span id="syncTime" class="sync-time"></span><button id="searchBtn" aria-label="Pesquisar" title="Pesquisar">⌕</button><button id="newBtn" class="primary" aria-label="Adicionar nota" title="Adicionar nota"><span class="new-plus" aria-hidden="true"></span><span class="new-label">Nova nota</span></button></div></header>
<div id="search" class="search hidden"><input id="searchInput" placeholder="Pesquisar notas..."><button id="closeSearch">×</button></div>
<main><section id="pinnedSec" class="hidden"><h2>FIXADAS</h2><div id="pinned" class="grid"></div></section><section><h2 id="sectionTitle">NOTAS</h2><div id="notes" class="grid"></div><div id="empty" class="empty"><div>📝</div><h3>Nenhuma nota ainda</h3><p>Crie sua primeira anotação.</p><button id="emptyNew" class="primary">+ Criar nota</button></div></section></main>
<div id="overlay" class="overlay hidden"><div id="card" class="editor" tabindex="-1"><div class="editorHead"><input id="title" placeholder="Título"><div><button id="pin">📍</button><button id="colors">🎨</button><button id="archive">📥</button><button id="del">🗑</button><button id="close">×</button></div></div>
<div id="palette" class="palette hidden"><button data-c="#fffdf5"></button><button data-c="#fff1f2"></button><button data-c="#fff7d6"></button><button data-c="#eaf7ee"></button><button data-c="#e8f3ff"></button><button data-c="#f1eaff"></button><button data-c="#fff"></button></div>
<div class="toolbar"><select id="font"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Trebuchet MS</option><option>Courier New</option></select><select id="size"><option value="2">Pequena</option><option value="3" selected>Normal</option><option value="4">Grande</option><option value="5">Muito grande</option><option value="6">Título</option></select><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><input id="textColor" type="color" value="#202124"><button data-cmd="justifyLeft">≡</button><button data-cmd="justifyCenter">☰</button><button data-cmd="justifyRight">≡</button><button data-cmd="insertUnorderedList">• Lista</button><button data-cmd="insertOrderedList">1. Lista</button><button id="link">🔗</button><button data-cmd="removeFormat" title="Remove negrito, cor, tamanho e outras formatações da seleção">↶ Limpar formatação</button></div>
<div id="content" class="content" contenteditable="true" data-placeholder="Comece a escrever..."></div><footer><span id="status">Nova nota</span><button id="save" class="primary">Salvar</button></footer></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
